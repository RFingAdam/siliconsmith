name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uvx --from 'reuse[charset-normalizer]==6.3.0' reuse lint
      - run: uv run python scripts/check_api_guard.py
      - run: uv run python scripts/check_no_binaries.py
      - run: uv run python scripts/check_wheel.py
      - name: Check commit and PR trailers
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: uv run python scripts/check_trailers.py "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
      - name: Set up Python for the pip-compat check
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: pip-compat install and import check
        run: |
          python -m venv "$RUNNER_TEMP/pc"
          "$RUNNER_TEMP/pc/bin/pip" install -e '.[amaranth,myhdl]'
          "$RUNNER_TEMP/pc/bin/siliconsmith" --version
          "$RUNNER_TEMP/pc/bin/python" -c 'import amaranth, myhdl'
          "$RUNNER_TEMP/pc/bin/python" -c 'import siliconsmith.server'
          "$RUNNER_TEMP/pc/bin/siliconsmith" server --help

  unit:
    name: unit (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -m "not integration"

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked
      - name: Work out the image tag
        run: |
          tag="ctx-$(PYTHONPATH=src python3 -m siliconsmith._imagetag)"
          echo "IMAGE=ghcr.io/rfingadam/siliconsmith-toolchain:${tag}" >> "$GITHUB_ENV"
      # Logging in is optional: the package is public once the owner has made it so, and a pull
      # that fails for any reason falls back to building the image in this job.
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image
        id: pull
        run: |
          if docker pull "$IMAGE"; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE is not in GHCR yet; building it in this job"
          fi
      - name: Set up Docker Buildx
        if: steps.pull.outputs.pulled != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        if: steps.pull.outputs.pulled != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm "$IMAGE" sh -c 'iverilog -V && verilator --version && yosys -V'
          v=$(docker run --rm "$IMAGE" verilator --version | awk '{print $2}')
          if [ "$(printf '%s\n5.036\n' "$v" | sort -V | head -n1)" != "5.036" ]; then
            echo "Verilator $v is older than 5.036 (needed by cocotb 2.1)"
            exit 1
          fi
      - name: Integration tests
        run: uv run pytest -m integration -v
        env:
          SILICONSMITH_IMAGE: ${{ env.IMAGE }}
