version = 1

[[annotations]]
path = [
  "**/*.md",
  ".gitignore",
  "uv.lock",
  "docker/requirements.lock",
  "docker/OFFER.txt",
  "scripts/third_party_crates.json",
  "**/py.typed",
  "NOTICE",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Adam Engelbrecht"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Content that may carry its own SPDX header (captured logs, adapted workflows): the header
# in the file wins; this is the default when there is none. The demo transcripts embed headers
# of generated files (Apache-2.0), so they stay Apache-2.0 through the closest rule.
[[annotations]]
path = [
  ".github/**",
  "tests/fixtures/**",
  "tests/golden/**",
  "docs/demos/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Adam Engelbrecht"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Stays Apache-2.0 so that users' chip designs are never encumbered: the skills (the agent copies
# their code examples into user designs), the glossary, and future example designs. In this file
# the last matching table wins, so these tables come after the AGPL defaults above.
[[annotations]]
path = [
  "src/siliconsmith/skills/**",
  "docs/glossary.md",
  "examples/**",
  "src/siliconsmith/templates/stubs/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Adam Engelbrecht"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "src/siliconsmith/templates/tt/**",
  "src/siliconsmith/templates/tt_support/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "Tiny Tapeout"
SPDX-License-Identifier = "Apache-2.0"

# The copyright holder is "Tiny Tapeout", as in the upstream template's own test/test.py header
# (SPDX-FileCopyrightText: 2024 Tiny Tapeout). The upstream LICENSE file is the unmodified
# Apache-2.0 text and names no holder. Files with their own header keep it (closest wins).

# These two stubs are adapted from Tiny Tapeout's Apache-2.0 src/project.v and test/test.py, so
# they keep the upstream copyright line next to ours. This table comes last so it wins.
[[annotations]]
path = [
  "src/siliconsmith/templates/stubs/test.py.tmpl",
  "src/siliconsmith/templates/stubs/verilog.v.tmpl",
]
precedence = "override"
SPDX-FileCopyrightText = ["2024 Tiny Tapeout", "2026 Adam Engelbrecht"]
SPDX-License-Identifier = "Apache-2.0"

# Verbatim license texts and notices of components that the toolchain image ships. Each file
# keeps the terms stated inside it; they are not Apache-2.0.
[[annotations]]
path = "docker/licenses/**"
precedence = "override"
SPDX-FileCopyrightText = "The authors of the respective components, as stated in each file"
SPDX-License-Identifier = "LicenseRef-Third-Party-Notices"
